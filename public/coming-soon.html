<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Konto - GameDeals</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .soon-page {
      min-height: calc(100vh - 72px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
    }

    .soon-card {
      width: min(600px, 100%);

      padding: 50px 30px;

      text-align: center;

      border: 1px solid #263247;
      border-radius: 18px;

      background: #101722;

      box-shadow:
        0 25px 60px rgba(0,0,0,0.35);
    }

    .soon-icon {
      font-size: 60px;
    }

    .soon-card h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .soon-card p {
      color: #94a3b8;
      line-height: 1.7;
    }

    .soon-card a {
      display: inline-block;

      margin-top: 20px;
      padding: 13px 20px;

      border-radius: 9px;

      background: #22c55e;

      color: #052e16;

      text-decoration: none;
      font-weight: 900;
    }

  </style>

</head>


<body>

<header>

  <div class="navbar">

    <a
      href="/"
      class="logo"
    >
      🎮 Game<span>Deals</span>
    </a>

  </div>

</header>


<main class="soon-page">

  <div class="soon-card">

    <div class="soon-icon">
      🚧
    </div>

    <h1>
      Konta już wkrótce
    </h1>

    <p>
      Pracujemy nad kontami GameDeals.
      Będziesz mógł obserwować gry,
      ustawiać alerty cenowe,
      zapisywać ulubione i otrzymywać
      własne rekomendacje.
    </p>

    <a href="/">
      ← Wróć do GameDeals
    </a>

  </div>

</main>

</body>
</html>
